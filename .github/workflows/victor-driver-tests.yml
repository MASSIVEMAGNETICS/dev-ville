name: Victor Driver Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: victor-driver-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile complete Python runtime
        run: python -m compileall -q .

      - name: Run complete combined regression
        run: python -m unittest discover -v -p "test_*.py"

      - name: Assess canonical empire topology
        run: python empire_control_plane.py --check --fail-on-critical

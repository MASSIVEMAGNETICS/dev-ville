name: Victor VSG1 Codec
on:
  pull_request:
    paths:
      - "semantic_codec.py"
      - "test_semantic_codec.py"
      - "vsg1_event_benchmark.py"
      - "test_vsg1_event_benchmark.py"
      - "docs/VSG1_EVENT_BENCHMARK.md"
      - ".github/workflows/vsg1.yml"
  push:
    branches: [main]
    paths:
      - "semantic_codec.py"
      - "test_semantic_codec.py"
      - "vsg1_event_benchmark.py"
      - "test_vsg1_event_benchmark.py"
      - "docs/VSG1_EVENT_BENCHMARK.md"
      - ".github/workflows/vsg1.yml"
jobs:
  codec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run codec and Chronos adapter tests
        run: python -m unittest -v test_semantic_codec.py test_vsg1_event_benchmark.py
      - name: Measure synthetic Chronos event corpus
        run: python vsg1_event_benchmark.py --records 128 --repeats 3 --output vsg1-benchmark-report.json
      - name: Preserve benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: vsg1-benchmark-py${{ matrix.python-version }}
          path: vsg1-benchmark-report.json
          if-no-files-found: error

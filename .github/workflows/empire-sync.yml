name: Empire Synchronization Spine

on:
  pull_request:
    paths:
      - "empire_sync/**"
      - "CANONICAL_EXECUTION_MAP.md"
      - "chronos/canonical_execution.jsonl"
      - ".github/workflows/empire-sync.yml"
  push:
    branches: [main]
    paths:
      - "empire_sync/**"
      - "CANONICAL_EXECUTION_MAP.md"
      - "chronos/canonical_execution.jsonl"
      - ".github/workflows/empire-sync.yml"
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empire-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Scheduled/manual runs may sit behind concurrency and start from a stale
          # event SHA. Resolve the branch tip at execution time instead.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile synchronization programs
        run: python -m py_compile empire_sync/check_empire_sync.py empire_sync/run_strict_with_retries.py empire_sync/validate_autopoiesis.py
      - name: Enforce autopoiesis safety policy
        run: python empire_sync/validate_autopoiesis.py
      - name: Validate local authority graph on pull requests
        if: github.event_name == 'pull_request'
        run: python empire_sync/check_empire_sync.py --local-only
      - name: Strict cross-repo verification with bounded retries
        id: strict
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python empire_sync/run_strict_with_retries.py --attempts 3 --write-report empire_sync/status.json
      - name: Commit semantic status transition
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- empire_sync/status.json)" ]; then
            echo "No semantic synchronization state change."
            exit 0
          fi

          # Preserve the freshly computed semantic result across remote refreshes.
          status_tmp="$(mktemp)"
          cp empire_sync/status.json "$status_tmp"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A different writer can advance main between checkout and push. Re-anchor
          # to the current remote tip before every attempt, reapply only the generated
          # status file, and never force-push.
          for attempt in 1 2 3; do
            echo "Synchronization status push attempt $attempt/3"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$status_tmp" empire_sync/status.json

            if [ -z "$(git status --porcelain -- empire_sync/status.json)" ]; then
              echo "Remote already contains this semantic synchronization state."
              exit 0
            fi

            git add empire_sync/status.json
            git commit -m "chore(sync): update empire synchronization status"

            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Synchronization status committed at $(git rev-parse HEAD)."
              exit 0
            fi

            echo "Remote advanced during push; retrying from the new remote tip."
          done

          echo "Unable to publish synchronization status after 3 non-force retries."
          exit 1
      - name: Fail closed on cross-repo drift
        if: github.event_name != 'pull_request' && steps.strict.outcome == 'failure'
        run: |
          echo "Empire synchronization drift detected after retry budget exhaustion. See empire_sync/status.json."
          exit 1
